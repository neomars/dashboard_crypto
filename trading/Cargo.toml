[package]
name = "trading-engine"
description = "Moteur de l'activité de trading (données Poloniex, signaux, risque, backtest), séparé des indicateurs du Dashboard Crypto"
version.workspace = true
edition.workspace = true
license.workspace = true

# Aucune dépendance vers dashboard-core : le moteur de trading ne lit ni ne
# modifie les indicateurs de marché du tableau de bord.
[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
