[package]
name = "dashboard-core"
description = "Données et calcul des indicateurs du Dashboard Crypto"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
dirs = "6"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "http2"] }
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
rust-ini = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["sync", "time"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
